services:
  db:
    # Voi folosi două versiuni diferite pentru baza de date: v1 pentru vulnerable și v2 pentru secure
    image: postgres:latest
    container_name: authx-db-v1
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}_v1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v1:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-vulnerable
    # Utilizatorul acesta va apărea în terminalul containerului
    user: "razvan-anghel-authx"
    ports:
      - "3000:3000"
    environment:
      - DB_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_v1
    depends_on:
      - db

volumes:
  postgres_data_v1: